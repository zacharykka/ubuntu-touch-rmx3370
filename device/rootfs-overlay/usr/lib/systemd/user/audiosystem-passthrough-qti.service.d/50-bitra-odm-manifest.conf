# realme GT Neo2 (bitra): the QTI RIL audio interface (IQcRilAudio, used to
# route call audio) is declared in the odm VINTF manifests
# (/odm/etc/vintf/telephony_manifest_{dsds,ssss}.xml), not under /vendor.
# The stock check-for-iqcrilaudio only greps /vendor, so this passthrough was
# skipped ("Skipped due to exec-condition") even though qcrild registers
# vendor.qti.hardware.radio.am@1.0::IQcRilAudio/slot1 and slot2.
[Service]
ExecCondition=
ExecCondition=/bin/sh -c "grep -qs IQcRilAudio /vendor/etc/vintf/*manifest*.xml /vendor/manifest.xml /odm/etc/vintf/*.xml"
