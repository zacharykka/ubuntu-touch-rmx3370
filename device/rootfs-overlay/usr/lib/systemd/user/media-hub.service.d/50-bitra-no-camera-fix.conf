# bitra: keep the camera-preview shim out of media-hub.
#
# media-hub inherits the session LD_PRELOAD from /etc/environment, which carries
# /usr/lib/bitra/libbitra-camera-preview-fix.so. With the shim loaded, media-hub
# builds one global BufferQueue shared by every sink; the camera viewfinder and
# the video recorder then contend for it and media-hub dies with
# "Main process exited, code=killed, status=11/SEGV", taking the camera app down
# with it (recording a video crashes, taking a photo does not).
#
# The NULL IGraphicBufferConsumer only has to be repaired in the app process, so
# this unit is given an LD_PRELOAD without the shim.
[Service]
Environment=LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libtls-padding.so
