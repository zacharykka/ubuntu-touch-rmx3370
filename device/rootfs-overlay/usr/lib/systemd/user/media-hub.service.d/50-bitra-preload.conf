# bitra: media-hub gets its own LD_PRELOAD instead of the session one from
# /etc/environment.
#
# 1. The camera-preview shim is left out. With it loaded, media-hub builds one
#    BufferQueue that the viewfinder and recorder sinks share; they contend and
#    media-hub dies with "status=11/SEGV", so recording a video crashes the
#    camera app. The NULL consumer only has to be repaired in the app process.
#
# 2. libbitra-mediahub-apparmor-fix.so is added. SELinux is the major LSM here
#    (/sys/kernel/security/lsm = capability,selinux), so dbus-daemon reports
#    every client's LinuxSecurityLabel as "u:r:kernel:s0". media-hub treats that
#    as an AppArmor profile, gets a one-part app id, and Context::profile_name()
#    reads app_id_parts[1] out of bounds -> SIGSEGV on every player session.
#    Gallery showed it as "Fail to connect with playback backend". The shim maps
#    an unparseable label to "unconfined", and only while AppArmor is disabled.
[Service]
Environment=LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libtls-padding.so:/usr/lib/bitra/libbitra-mediahub-apparmor-fix.so
