# realme GT Neo2 (bitra): run adbd without host-key verification.
#
# adbd.service ships Environment=ADBD_SECURE=1, which enables the host-key
# authentication path (adbd_auth, served over adbd.socket). On this device that
# path is what turns a USB disturbance into a crash: whenever the gadget is
# re-composed (usb-moded restarting, a suspend/resume of the link) the kernel
# logs
#     dwc3 a600000.dwc3: request ... was not queued to ep0out
# and when it does so from the "adbd auth" thread, adbd dies right after:
#     adbd.service: Main process exited, code=killed, status=11/SEGV
# Seen twice in one boot (t=1221s and t=1507s), and only in boots where the
# secure path was exercised. With ADBD_SECURE=0 the same disturbance is handled
# by the UsbFfs worker thread and adbd survives it.
#
# Verification adds nothing here: /data/misc/adb/adb_keys already holds the
# host key and every session is over a cable the user plugged in. The unit
# itself documents this switch as the development override.
[Service]
Environment=ADBD_SECURE=0
