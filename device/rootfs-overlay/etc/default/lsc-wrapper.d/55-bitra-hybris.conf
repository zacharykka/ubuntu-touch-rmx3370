# lsc-wrapper sources every file in this directory and the exports survive
# into the compositor. The equivalent Environment= in
# /etc/systemd/system/lightdm.service.d does not reliably reach it: lightdm
# starts the system compositor through a PAM session, which resets the
# environment (this is why lsc-wrapper itself sets GLIBC_TUNABLES).
#
# Why it is needed: libhybris' linker only has /system/lib64, /vendor/lib64 and
# /odm/lib64 baked in (verified in /usr/lib/aarch64-linux-gnu/libhybris/linker/*.so).
# The Adreno EGL subdriver lives in /vendor/lib64/egl, so without this Mir dies
# with:  dlopen failed: library "eglSubDriverAndroid.so" not found
export HYBRIS_LD_LIBRARY_PATH=/usr/lib/halium/hybris-libs:/vendor/lib64/egl:/vendor/lib64/hw:/vendor/lib64:/system/lib64:/odm/lib64
