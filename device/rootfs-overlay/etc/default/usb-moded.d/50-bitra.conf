# realme GT Neo2 (bitra): usb-moded environment for this port.
# usb-moded.service reads /etc/default/usb-moded.d/*.conf as EnvironmentFile=,
# and the UBports configurator (its ExecStartPre) sees the same variables.

# Names shown to the USB host. Without these the configurator uses
# ro.product.vendor.model from the container, and usb-moded keeps the vendor
# string "Kona for arm64".
MANUFACTURER="realme"
PRODUCT="GT Neo2 (Ubuntu Touch)"

# Turn off usb-moded's rescue mode. usb-moded.service sets
# Environment=USB_MODED_ARGS=-r, and EnvironmentFile= settings override it.
# With -r, a boot while connected to a PC selects developer_mode (RNDIS, plus
# sshd on 10.15.19.82:8022 and udhcpd, no adb). usb-moded keeps that mode
# after init-done until a mode is picked by hand or the cable is unplugged
# (control_rethink_usb_mode() locks on to rescue mode). macOS has no RNDIS
# driver, so the host saw nothing until a manual mode switch.
# Without -r, usb-moded holds charging_fallback until init-done
# (usb-rescue-mode-off.service, after the display manager) and then enters
# the default mode, mtp_adb (/etc/usb-moded/99-bitra-default-mode.ini).
# Cost: no SSH-over-RNDIS rescue if a boot never reaches the display manager.
USB_MODED_ARGS=""
