# realme GT Neo2 (bitra): default to rndis_adb on a PC connection.
#
# 10-ubports-defaults.ini sets [usbmode] mode=mtp, which exposes no adb
# function, so a fresh boot shows no adb to the host until the user manually
# switches modes (which triggers a gadget re-compose that includes adb).
# usb-moded reads *.ini in lexical order and the last [usbmode] mode wins, so
# this file (sorted after 10-/20-/30-/90-) overrides the default to rndis_adb
# (USB tethering + adb), matching how the device is used.
[usbmode]
mode = rndis_adb
