# realme GT Neo2 (bitra): ofono-binder-plugin slots.
# qcrild registers android.hardware.radio@1.5::IRadio/slot1 and /slot2 (DSDS).
# Pinning the slots makes start-up deterministic. extPlugin = qti loads
# ofono-binder-plugin-ext-qti for IMS (VoLTE calls and SMS over IMS).
[Settings]
ExpectSlots = slot1,slot2
radioInterface = 1.5
extPlugin = qti

[slot1]
path = /ril_0
slot = 0

[slot2]
path = /ril_1
slot = 1
