# realme GT Neo2 (bitra): RIL slot names for audiosystem-passthrough.
# With ofono-binder-plugin in use (see /etc/deviceinfo/devices/kona.yaml) ofono
# itself does not read this file. audiosystem-passthrough (type qti) does: it
# takes the slot names from [ril_N] transport=binder:name=<slot> here or in
# /etc/ofono/ril_subscription.conf, and exits with status 2 when it finds none.
# It then binds vendor.qti.hardware.radio.am@1.0::IQcRilAudio/<slot>, which
# qcrild uses to route call audio.
[ril_0]
transport=binder:name=slot1
name=slot1

[ril_1]
transport=binder:name=slot2
name=slot2
