[Service]
# libhybris linker only has /system/lib64, /vendor/lib64, /odm/lib64 and the
# apex dirs baked in - NOT /vendor/lib64/egl, where the Adreno
# eglSubDriverAndroid.so lives. Without this, Mir fails with
#   dlopen failed: library "eglSubDriverAndroid.so" not found
# and the system compositor never starts, so lightdm restarts in a loop.
Environment=HYBRIS_LD_LIBRARY_PATH=/usr/lib/halium/hybris-libs:/vendor/lib64/egl:/vendor/lib64/hw:/vendor/lib64:/system/lib64:/odm/lib64
